<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Duelo de Torres Steampunk V0.3.1</title><style>*{box-sizing:border-box}body{margin:0;background:#101922;color:#f4dfb2;font-family:system-ui,Arial;display:flex;justify-content:center}#app{width:min(100vw,490px);height:100dvh;display:flex;flex-direction:column;background:#182631}header{height:43px;display:flex;align-items:center;justify-content:space-around;background:#29343b;border-bottom:2px solid #b18a4a;font-size:13px}#arena{width:100%;flex:1;min-height:0;touch-action:none;display:block;background:#293d3a}#hud{padding:6px 7px 10px;background:#1c2831;border-top:2px solid #b58d4d}#energy{height:14px;background:#0b121b;border-radius:9px;overflow:hidden;border:1px solid #6f93a2}#fill{height:100%;width:50%;background:linear-gradient(90deg,#4387b4,#78e7f9)}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}.card{border:2px solid #876b42;border-radius:8px;background:linear-gradient(#4b514a,#222d34);color:#fff1c9;padding:5px 1px;font-size:11px;min-height:64px}.card b{display:block;font-size:22px}.card.sel{border-color:#73e9ff;box-shadow:0 0 9px #45d9f5}.card:disabled{opacity:.43}#skills{display:flex;gap:6px;margin-top:6px}.skill{flex:1;border:1px solid #b99957;background:#3b3530;color:#ffedc4;border-radius:7px;padding:9px 2px;font-size:12px}.skill.sel{background:#266d79;border-color:#9defff}#msg{text-align:center;min-height:17px;font-size:12px;color:#f7c77c}button{cursor:pointer}#overlay{position:absolute;inset:0;background:#071017c9;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:15px;z-index:5}#overlay button{padding:14px 24px;background:#c79747;border:0;border-radius:8px;font-weight:bold;font-size:17px}#app{background:#1a232b}header{background:#202d38;border-bottom:2px solid #8e9c9e;color:#e9e5d9;letter-spacing:.4px}#hud{background:#1c2832;border-top:2px solid #6f8289}#energy{border:1px solid #8b9da2;border-radius:3px}#fill{background:linear-gradient(90deg,#2d7698,#74c4d6)}.card{background:linear-gradient(165deg,#47545a,#202e39);border:1px solid #71858e;border-radius:5px;color:#f0f0e9}.card.sel{border:2px solid #8cd8ed;box-shadow:inset 0 0 0 1px #274f5e}.skill{background:#344550;border:1px solid #7b9198;border-radius:4px;color:#f3eee2}.skill.sel{background:#285c6b}#overlay{background:#111b25ed;color:#e6e8e7;padding:25px}#overlay h1{letter-spacing:2px}#overlay button,#start{border:1px solid #afc1c6;background:#547d8b;color:#fff;border-radius:4px;font-size:16px;font-weight:800;letter-spacing:1px;padding:15px 18px}#menu{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#15202be9,#263e4ce8);padding:22px;text-align:center}.menu-panel{width:min(100%,420px);border:2px solid #718c98;background:linear-gradient(160deg,#293b47,#18252f);box-shadow:0 18px 55px #0009;padding:30px 18px;color:#e8eceb}.eyebrow{font-size:11px;color:#a9c3ce;letter-spacing:3px}.menu-panel h1{font-size:clamp(27px,7vw,39px);line-height:1.06;letter-spacing:2px;margin:17px 0 8px}.sub{font-size:13px;letter-spacing:2px;color:#9fbecb}.menu-line{height:2px;background:#718e9c;margin:22px 0}.menu-panel p{font-size:13px;color:#d0d9d9;margin-bottom:24px}#start{width:100%;min-height:56px}.menu-panel small{display:block;font-size:11px;color:#aebdc2;margin-top:18px;line-height:1.5}#msg{color:#cbdce0}</style></head><body><main id="app"><header><b>DUELO DE TORRES · V0.3.1</b><span id="clock">02:30</span><span id="score">👑 0 - 0</span></header><canvas id="arena"></canvas><section id="hud"><div style="display:flex;justify-content:space-between;font-size:12px"><span>⚡ Vapor <span id="energyText">5.0</span>/10</span><span id="next">Próxima: —</span></div><div id="energy"><div id="fill"></div></div><div id="cards"></div><div id="skills"><button class="skill" data-skill="blast">💥 Bombardeo (4⚡)</button><button class="skill" data-skill="boost">⚡ Sobrecarga (3⚡)</button></div><div id="msg">Elegí una carta y tocá tu territorio.</div></section></main><div id="overlay"><h1 id="outcome"></h1><p id="detail"></p><button onclick="acknowledge()">OK · VOLVER AL MENÚ</button></div><div id="menu"><div class="menu-panel"><div class="eyebrow">CENTRO DE OPERACIONES</div><h1>DUELO DE TORRES</h1><div class="sub">STEAMPUNK · V0.3.1</div><div class="menu-line"></div><p>Dos frentes · Ocho unidades · Combate táctico</p><button id="start" onclick="startGame()">START · INICIAR PARTIDA</button><small>Seleccioná tus cartas y desplegá tus tropas en el campo.</small></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('arena'),ctx=canvas.getContext('2d');let W=400,H=600,units=[],shots=[],particles=[],towers=[],energy=5,enemyEnergy=5,elapsed=0,gameOver=false,phase='menu',selected=0,skill=null,hand=[],deck=[],aiWait=2,frame=0,shake=0,score=[0,0];const D=[{name:'Fusileros',icon:'🔫',cost:3,hp:90,damage:15,range:85,speed:38,rate:1.05,count:2,role:'ranged'},{name:'Granaderos',icon:'💣',cost:4,hp:105,damage:31,range:72,speed:30,rate:1.6,count:2,role:'splash'},{name:'Autómatas',icon:'🤖',cost:3,hp:185,damage:21,range:19,speed:30,rate:1,count:2,role:'melee'},{name:'Exploradores',icon:'🏃',cost:2,hp:65,damage:12,range:16,speed:70,rate:.6,count:3,role:'melee'},{name:'Blindado',icon:'🛡️',cost:5,hp:560,damage:35,range:25,speed:19,rate:1.5,count:1,role:'building'},{name:'Artilleros',icon:'🎯',cost:4,hp:90,damage:38,range:145,speed:20,rate:2.1,count:1,role:'splash'},{name:'Tanque pesado',icon:'🚂',cost:7,hp:980,damage:65,range:48,speed:15,rate:2.2,count:1,role:'building'},{name:'Médico mecánico',icon:'🔧',cost:3,hp:135,damage:0,range:70,speed:34,rate:1.1,count:1,role:'heal'}];const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a);function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}window.addEventListener('resize',resize);function pos(side,lane,kind){return {x:W*(lane===0?.25:.75),y:side===1?(kind==='king'?H*.93:H*.77):(kind==='king'?H*.07:H*.23)}}function initTowers(){towers=[];for(let side of [-1,1]){for(let lane=0;lane<2;lane++){let p=pos(side,lane,'side');towers.push({...p,side,lane,kind:'side',hp:1050,max:1050,range:W*.27,damage:25,rate:.85,cool:0,dead:false})}let p={x:W*.5,y:side===1?H*.94:H*.06};towers.push({...p,side,lane:1,kind:'king',hp:2000,max:2000,range:W*.32,damage:36,rate:.8,cool:0,dead:false,active:false})}}function restart(){phase='menu';units=[];shots=[];particles=[];elapsed=0;energy=5;enemyEnergy=5;score=[0,0];gameOver=false;aiWait=2;skill=null;selected=0;deck=[0,1,2,3,4,5,6,7].sort(()=>Math.random()-.5);hand=deck.splice(0,4);initTowers();$('overlay').style.display='none';$('menu').style.display='flex';$('msg').textContent='Presioná START para comenzar';renderCards();resize()}window.restart=restart;function startGame(){phase='playing';$('menu').style.display='none';$('msg').textContent='Elegí una carta y tocá tu territorio'}window.startGame=startGame;function acknowledge(){restart()}window.acknowledge=acknowledge;function renderCards(){let box=$('cards');box.innerHTML='';hand.forEach((id,i)=>{let d=D[id],b=document.createElement('button');b.className='card'+(selected===i&&!skill?' sel':'');b.innerHTML='<b>'+d.icon+'</b>'+d.name+'<br>⚡'+d.cost;b.disabled=phase!=='playing'||energy<d.cost;b.onclick=()=>{selected=i;skill=null;renderCards();$('msg').textContent='Tocá tu mitad del campo para desplegar '+d.name};box.appendChild(b)});$('next').textContent='Próxima: '+D[deck[0]].name;document.querySelectorAll('.skill').forEach(b=>{b.classList.toggle('sel',skill===b.dataset.skill);b.onclick=()=>{if(phase!=='playing')return;skill=skill===b.dataset.skill?null:b.dataset.skill;renderCards();$('msg').textContent=skill==='blast'?'Tocá una zona para bombardear':skill==='boost'?'Tocá tus tropas para sobrecargarlas':'Elegí una carta'}})}function spawn(side,id,lane,y){let d=D[id],x=W*(lane===0?.25:.75);for(let i=0;i<d.count;i++){units.push({side,id,lane,x:x+rnd(-18,18),y:y+side*rnd(-14,14),hp:d.hp,max:d.hp,cool:rnd(0,.5),boost:0,flash:0})}}function addFx(x,y,col,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-80,80),vy:rnd(-90,45),life:rnd(.25,.7),max:.7,col,size:rnd(2,5)})}function damage(o,d){if(o.dead)return;o.hp-=d;o.flash=.15;addFx(o.x,o.y,'#ffbf68',3);if(o.hp<=0){o.hp=0;o.dead=true;addFx(o.x,o.y,'#ff802e',20);shake=6;if(o.kind){score[o.side===-1?0:1]+=o.kind==='king'?3:1;if(o.kind==='side'){let king=towers.find(t=>t.side===o.side&&t.kind==='king');king.active=true}if(o.kind==='king')finish(o.side===-1?'¡VICTORIA!':'DERROTA')}}}function finish(title){gameOver=true;phase='ended';$('outcome').textContent=title;$('detail').textContent='Torres destruidas: '+score[0]+' - '+score[1];$('overlay').style.display='flex'}function shoot(a,b,d,splash=false){shots.push({x:a.x,y:a.y,tx:b.x,ty:b.y,target:b,damage:d,side:a.side,splash,life:.18,total:.18})}function choose(u){let enemies=units.filter(v=>v.side!==u.side&&v.hp>0),d=D[u.id];if(d.role==='heal'){let allies=units.filter(v=>v.side===u.side&&v!==u&&v.hp<v.max);return allies.sort((a,b)=>dist(u,a)-dist(u,b))[0]}if(d.role!=='building'){let near=enemies.filter(v=>dist(u,v)<d.range+24).sort((a,b)=>dist(u,a)-dist(u,b))[0];if(near)return near}let targets=towers.filter(t=>t.side!==u.side&&!t.dead&&(t.kind==='side'||t.active));let same=targets.filter(t=>t.kind==='side'&&t.lane===u.lane);return (same.length?same:targets).sort((a,b)=>dist(u,a)-dist(u,b))[0]}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function tick(dt){if(phase!=='playing'||gameOver)return;elapsed+=dt;frame+=dt;energy=Math.min(10,energy+dt*(elapsed>100?1.2:.65));enemyEnergy=Math.min(10,enemyEnergy+dt*.7);shake=Math.max(0,shake-dt*30);if(elapsed>=150){let a=towers.filter(t=>t.side===-1).reduce((s,t)=>s+t.hp/t.max,0),b=towers.filter(t=>t.side===1).reduce((s,t)=>s+t.hp/t.max,0);finish(a<b?'¡VICTORIA!':a>b?'DERROTA':'¡EMPATE!')}aiWait-=dt;if(aiWait<=0){let lane=0;let danger=[0,0];units.filter(u=>u.side===1).forEach(u=>danger[u.lane]+=D[u.id].hp);lane=danger[1]>danger[0]?1:danger[0]>danger[1]?0:Math.random()<.5?0:1;let options=D.map((d,i)=>({i,c:d.cost})).filter(o=>o.c<=enemyEnergy);if(options.length){let id=options[Math.floor(Math.random()*options.length)].i;spawn(-1,id,lane,H*.33);enemyEnergy-=D[id].cost}aiWait=rnd(1.8,3.8)}for(let u of units){if(u.hp<=0)continue;u.cool-=dt;u.flash=Math.max(0,u.flash-dt);u.boost=Math.max(0,u.boost-dt);let d=D[u.id],target=choose(u);if(!target)continue;let range=d.range+(target.kind?17:0),r=dist(u,target);if(r<=range){if(u.cool<=0){u.cool=d.rate/(u.boost>0?1.7:1);if(d.role==='heal'){target.hp=Math.min(target.max,target.hp+45);addFx(target.x,target.y,'#6affc6',7)}else if(d.role==='melee'||d.role==='building'){damage(target,d.damage*(u.boost>0?1.5:1))}else shoot(u,target,d.damage*(u.boost>0?1.5:1),d.role==='splash')}}else{let vx=(target.x-u.x)/r,vy=(target.y-u.y)/r;let speed=d.speed*(u.boost>0?1.45:1);let nextY=u.y+vy*speed*dt;if((u.y-H*.5)*(nextY-H*.5)<0){let bridgeX=W*(u.lane===0?.25:.75);if(Math.abs(u.x-bridgeX)>8){vx=(bridgeX-u.x)/Math.abs(bridgeX-u.x);vy=0}}u.x=Math.max(12,Math.min(W-12,u.x+vx*speed*dt));u.y=Math.max(8,Math.min(H-8,u.y+vy*speed*dt))}}for(let t of towers){if(t.dead)continue;t.cool-=dt;t.flash=Math.max(0,(t.flash||0)-dt);if(t.kind==='king'&&!t.active)continue;let targets=units.filter(u=>u.side!==t.side&&u.hp>0&&dist(u,t)<t.range).sort((a,b)=>dist(a,t)-dist(b,t));if(targets.length&&t.cool<=0){t.cool=t.rate;shoot(t,targets[0],t.damage)}}for(let s of shots){s.life-=dt;if(s.life<=0){if(s.target.hp>0){damage(s.target,s.damage);if(s.splash){for(let u of units)if(u!==s.target&&u.side!==s.side&&u.hp>0&&dist(u,s.target)<35)damage(u,s.damage*.45)}}addFx(s.tx,s.ty,'#ffd071',6)}}shots=shots.filter(s=>s.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=110*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);units=units.filter(u=>u.hp>0);$('fill').style.width=(energy*10)+'%';$('energyText').textContent=energy.toFixed(1);$('clock').textContent=String(Math.floor(Math.max(0,150-elapsed)/60)).padStart(2,'0')+':'+String(Math.floor(Math.max(0,150-elapsed)%60)).padStart(2,'0');$('score').textContent='👑 '+score[0]+' - '+score[1];for(let i=0;i<hand.length;i++)$('cards').children[i].disabled=phase!=='playing'||energy<D[hand[i]].cost}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function line(x,y,X,Y,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}function draw(){ctx.save();ctx.translate(rnd(-shake,shake),rnd(-shake,shake));let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4c4d47');g.addColorStop(.48,'#565c52');g.addColorStop(.52,'#374e55');g.addColorStop(1,'#344d48');rect(0,0,W,H,g);for(let i=0;i<11;i++){let y=i*H/10;line(0,y,W,y,'#ffffff0b')}for(let i=0;i<10;i++){let x=i*W/9;line(x,0,x,H,'#ffffff08')}rect(0,H*.475,W,H*.05,'#173b4e');for(let i=0;i<30;i++){let x=i*W/29;line(x,H*.48+Math.sin(frame*2+i)*3,x+12,H*.48+Math.sin(frame*2+i)*3,'#6ab9cc50',2)}for(let lane=0;lane<2;lane++){let x=W*(lane===0?.25:.75);rect(x-W*.11,H*.466,W*.22,H*.068,'#776a52');for(let j=-2;j<=2;j++)line(x+j*W*.04,H*.467,x+j*W*.04,H*.533,'#3c352c',2);line(x-W*.11,H*.466,x+W*.11,H*.466,'#d4b16d',3);line(x-W*.11,H*.533,x+W*.11,H*.533,'#d4b16d',3)}for(let t of towers){if(t.dead){ctx.fillStyle='#26231f';ctx.beginPath();ctx.arc(t.x,t.y,22,0,7);ctx.fill();continue}ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle='#0b151c88';ctx.beginPath();ctx.ellipse(2,12,t.kind==='king'?30:23,11,0,0,7);ctx.fill();ctx.fillStyle=t.side===1?'#377b92':'#aa4b43';ctx.strokeStyle='#d7aa64';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-19,-17,t.kind==='king'?38:34,t.kind==='king'?35:32,5);ctx.fill();ctx.stroke();ctx.fillStyle='#b8a183';ctx.fillRect(-11,-12,22,8);ctx.fillStyle='#25323b';ctx.fillRect(-5,-15,10,15);ctx.restore();bar(t.x-25,t.y+(t.side===-1?-34:25),50,6,t.hp/t.max,t.side===1?'#5cdbef':'#f06c5b');if(t.kind==='king'){ctx.fillStyle='#ffe4a6';ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillText('♛',t.x,t.y+4)}}for(let u of units){let d=D[u.id];ctx.save();ctx.translate(u.x,u.y);ctx.fillStyle='#08121b80';ctx.beginPath();ctx.ellipse(1,8,12,5,0,0,7);ctx.fill();ctx.fillStyle=u.flash>0?'#fff':u.side===1?'#55b6cc':'#d46b55';ctx.strokeStyle='#d6b67c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,d.role==='building'?13:10,0,7);ctx.fill();ctx.stroke();ctx.font=d.role==='building'?'17px system-ui':'14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.icon,0,-1);if(u.boost>0){ctx.strokeStyle='#7cffff';ctx.beginPath();ctx.arc(0,0,17+Math.sin(frame*8)*2,0,7);ctx.stroke()}ctx.restore();bar(u.x-13,u.y-21,26,4,u.hp/u.max,u.side===1?'#67f0a0':'#ff8a7a')}for(let s of shots){let k=1-s.life/s.total,x=s.x+(s.tx-s.x)*k,y=s.y+(s.ty-s.y)*k;ctx.fillStyle='#ffdd81';ctx.shadowColor='#ffc44b';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x,y,s.splash?5:3,0,7);ctx.fill();ctx.shadowBlur=0}for(let p of particles){ctx.globalAlpha=Math.min(1,p.life/.35);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}function bar(x,y,w,h,f,color){rect(x-1,y-1,w+2,h+2,'#0c161d');rect(x,y,w,h,'#522a2b');rect(x,y,w*Math.max(0,f),h,color)}function touch(ev){if(phase!=='playing'||gameOver)return;ev.preventDefault();let r=canvas.getBoundingClientRect(),x=(ev.clientX-r.left),y=ev.clientY-r.top,lane=x<W*.5?0:1;if(skill==='blast'){if(energy<4){$('msg').textContent='No alcanza el vapor';return}energy-=4;for(let u of units)if(u.side===-1&&dist(u,{x,y})<65)damage(u,150);for(let t of towers)if(t.side===-1&&dist(t,{x,y})<65)damage(t,190);addFx(x,y,'#ffae39',35);shake=8;skill=null;renderCards();return}if(skill==='boost'){if(energy<3){$('msg').textContent='No alcanza el vapor';return}energy-=3;let n=0;for(let u of units)if(u.side===1&&dist(u,{x,y})<95){u.boost=7;n++}addFx(x,y,'#65efff',18);$('msg').textContent='Sobrecarga: '+n+' unidades potenciadas';skill=null;renderCards();return}if(y<H*.53){$('msg').textContent='Solo podés desplegar en tu mitad del campo';return}let id=hand[selected],d=D[id];if(energy<d.cost)return;energy-=d.cost;spawn(1,id,lane,Math.max(H*.55,Math.min(H*.92,y)));hand[selected]=deck.shift();deck.push(id);renderCards()}canvas.addEventListener('pointerdown',touch);let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;tick(dt);draw();requestAnimationFrame(loop)}restart();requestAnimationFrame(loop)})();</script></body></html>
